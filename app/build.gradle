plugins {
    id 'com.android.application'
}

android {
    namespace 'li.lingfeng.ltweaks'
    compileSdk 35

    defaultConfig {
        applicationId "li.lingfeng.ltweaks"
        minSdk 21
        targetSdk 35
        versionCode 29
        versionName '1.22.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "versionCode"
    productFlavors {
        main0 {
        }
        selfUse {
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    compileOnly files('lib/XposedBridgeApi-54.jar')
    implementation project(':lib')
    compileOnly project(':hiddenapi')
    annotationProcessor project(':compiler')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'com.crossbowffs.remotepreferences:remotepreferences:0.5'
    implementation 'com.github.sevar83:indeterminate-checkbox:1.0.5@aar'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.59.2'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
    implementation 'com.google.dagger:dagger:2.59.2'
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
}
