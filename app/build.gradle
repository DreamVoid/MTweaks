plugins {
    id 'com.android.application'
}

android {
    namespace 'me.dreamvoid.mtweaks'
    compileSdk 37

    defaultConfig {
        applicationId "me.dreamvoid.mtweaks"
        minSdk 28
        targetSdk 37
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
    if (!task.name.contains('UnitTest') && !task.name.contains('AndroidTest')) {
        def variant = task.name.replace('compile', '').replace('JavaWithJavac', '')
        task.dependsOn("process${variant}Resources")
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'org.apache.commons:commons-lang3:3.22.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation project(':lib')
    compileOnly project(':hiddenapi')
    annotationProcessor project(':compiler')
}
